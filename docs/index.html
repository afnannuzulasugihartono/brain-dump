<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0d1117">
  <title>Brain Dump</title>
  <meta name="description" content="Notes and ideas backed by GitHub Issues.">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/app.css">
  <link rel="stylesheet" href="./styles/review.css">
  <link rel="stylesheet" href="./styles/ticker.css">
  <link rel="stylesheet" href="./styles/boot.css">
</head>
<body>
  <div id="bootIntro" class="boot-intro" aria-hidden="true" hidden>
    <div class="boot-grid" aria-hidden="true"></div>
    <div class="boot-core">
      <div class="boot-corners" aria-hidden="true"></div>
      <strong class="boot-wordmark">Brain Dump</strong>
      <span class="boot-status">MEMORY INTERFACE <b>ONLINE</b><i aria-hidden="true"></i></span>
    </div>
  </div>

  <aside id="sidebar" class="sidebar" aria-label="Brain Dump navigation">
    <div class="sidebar-head">
      <div class="sidebar-brand-slot">
        <a class="sidebar-brand-mark" href="./" aria-label="Brain Dump home">BD</a>
        <button id="sidebarBrandToggle" class="sidebar-brand-toggle" type="button" aria-label="Expand sidebar" title="Expand sidebar">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2.5"></rect><path d="M9 4v16"></path></svg>
        </button>
      </div>
      <a class="sidebar-brand-label" href="./">Brain Dump</a>
      <button id="sidebarToggle" class="sidebar-collapse" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2.5"></rect><path d="M9 4v16"></path></svg>
      </button>
    </div>

    <a class="sidebar-new-note" data-tooltip="New note" href="https://github.com/afnannuzulasugihartono/brain-dump/issues/new?template=idea.yml">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      <span>New note</span>
    </a>

    <nav class="sidebar-nav" aria-label="Idea views">
      <button class="view-link active" data-view="notes" data-tooltip="Notes" type="button" aria-current="page">
        <svg class="nav-icon" data-icon="notes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 7h12M6 12h12M6 17h8"></path></svg>
        <span>Notes</span>
      </button>
      <button class="view-link" data-view="review" data-tooltip="Review" type="button">
        <svg class="nav-icon" data-icon="review" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 5h6M9 3h6a2 2 0 0 1 2 2v1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h1V5a2 2 0 0 1 2-2Z"></path><path d="m8.5 14 2.2 2.2 4.8-5"></path></svg>
        <span>Review</span>
      </button>
      <button class="view-link" data-view="board" data-tooltip="Board" type="button">
        <svg class="nav-icon" data-icon="board" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="6" height="16" rx="1.5"></rect><rect x="14" y="4" width="6" height="9" rx="1.5"></rect></svg>
        <span>Board</span>
      </button>
      <button class="view-link" data-view="calendar" data-tooltip="Calendar" type="button">
        <svg class="nav-icon" data-icon="calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M7.5 3v4M16.5 3v4M3.5 9.5h17"></path><path d="M8 13h2M14 13h2M8 16.5h2M14 16.5h2"></path></svg>
        <span>Calendar</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <a class="sidebar-utility" data-tooltip="GitHub" href="https://github.com/afnannuzulasugihartono/brain-dump">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 19c-4 1.2-4-2-5-2.5M14 21v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.8-1.4 5.8-6.3A4.9 4.9 0 0 0 18 5.8 4.6 4.6 0 0 0 17.9 2S16.8 1.6 14 3.3a11.6 11.6 0 0 0-6 0C5.2 1.6 4.1 2 4.1 2A4.6 4.6 0 0 0 4 5.8a4.9 4.9 0 0 0-1.3 3.4c0 4.9 3 6 5.8 6.3-.5.4-.6 1-.5 2V21"></path></svg>
        <span>GitHub</span>
      </a>
      <button class="sidebar-utility theme-toggle" data-tooltip="Theme" type="button" aria-label="Toggle theme">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-1-.2-2-.5-2.8A7 7 0 0 1 12 3Z"></path></svg>
        <span>Theme</span>
      </button>
    </div>
  </aside>

  <header class="mobile-topbar">
    <div class="shell mobile-topbar-inner">
      <a class="mobile-brand" href="./" aria-label="Brain Dump home">Brain Dump</a>
      <div class="mobile-actions">
        <button class="icon-button theme-toggle" type="button" aria-label="Toggle theme">◐</button>
        <a class="new-button" href="https://github.com/afnannuzulasugihartono/brain-dump/issues/new?template=idea.yml">New note</a>
      </div>
    </div>
  </header>

  <div class="page-area">
    <main class="shell main">
      <section id="greeting" class="landing-intro" aria-labelledby="greetingTitle">
        <div class="greeting-copy">
          <h1 id="greetingTitle">Good morning</h1>
          <p id="greetingSubtitle">Ready to capture a thought?</p>
        </div>
        <a class="composer" href="https://github.com/afnannuzulasugihartono/brain-dump/issues/new?template=idea.yml"><span>What's on your mind?</span><small>Write a note…</small></a>
      </section>
      <div class="tools"><label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Search" autocomplete="off" aria-label="Search ideas"></label><div class="filters"><select id="categoryFilter" aria-label="Filter by category"><option value="all">Category</option></select><select id="stageFilter" aria-label="Filter by stage"><option value="all">Stage</option></select></div></div>
      <p id="activeFilters" class="filter-note" hidden></p>
      <section id="notesView" class="view active"></section>
      <section id="reviewView" class="view"></section>
      <section id="boardView" class="view"></section>
      <section id="calendarView" class="view"></section>
    </main>
    <footer class="shell footer"><nav aria-label="Brain Dump links"><a href="https://github.com/afnannuzulasugihartono/brain-dump/issues">Issues</a><a href="https://github.com/users/afnannuzulasugihartono/projects/1/views/1">Project</a><a href="https://github.com/afnannuzulasugihartono/brain-dump">Repository</a></nav></footer>
  </div>

  <aside id="ticker" class="ticker" aria-label="Brain Dump status" tabindex="0"></aside>
  <nav class="mobile-nav" aria-label="Idea views">
    <button class="view-link active" data-view="notes" type="button" aria-current="page">Notes</button>
    <button class="view-link" data-view="review" type="button">Review</button>
    <button class="view-link" data-view="board" type="button">Board</button>
    <button class="view-link" data-view="calendar" type="button">Calendar</button>
  </nav>
  <template id="emptyTemplate"><div class="empty"><strong>No notes yet.</strong><span>Try another filter or jot something down.</span></div></template>
  <script type="module" src="./js/app.js?v=20260924-sync1"></script>
</body>
</html>
