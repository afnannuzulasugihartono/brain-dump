name: Update idea timeline

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: brain-dump-content
  cancel-in-progress: true

jobs:
  update-timeline:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.user.login == github.repository_owner
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install animation dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate Brain Dump views
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_timeline.py

      - name: Commit generated content when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TIMELINE.md README.md docs/ideas.json assets/idea-journey-light.svg assets/idea-journey-dark.svg assets/idea-journey-light.gif assets/idea-journey-dark.gif
          if git diff --cached --quiet; then
            echo "Generated content unchanged."
          else
            git commit -m "docs: update idea timeline"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Brain Dump site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy Brain Dump site
        id: deployment
        uses: actions/deploy-pages@v4
