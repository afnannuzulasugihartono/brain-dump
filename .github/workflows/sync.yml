name: Sync Brain Dump

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/sync.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: brain-dump-sync
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event_name != 'issues' ||
      github.event.issue.user.login == github.repository_owner ||
      contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.issue.author_association)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Run frontend logic tests
        run: node --experimental-default-type=module --test tests/frontend/scoring.test.js tests/frontend/data.test.js

      - name: Generate Brain Dump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_timeline.py

      - name: Validate generated data
        run: python3 scripts/validate_generated.py

      - name: Commit generated content when changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          GENERATED="README.md TIMELINE.md docs/data/ideas.json"
          git add $GENERATED
          if git diff --cached --quiet; then
            echo "Generated content unchanged."
            exit 0
          fi

          git commit -m "docs: sync brain dump"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt $attempt failed; refreshing from latest main."
            git fetch origin main
            git reset --hard origin/main
            python3 -m unittest discover -s tests -v
            node --experimental-default-type=module --test tests/frontend/scoring.test.js tests/frontend/data.test.js
            python3 scripts/generate_timeline.py
            python3 scripts/validate_generated.py
            git add $GENERATED

            if git diff --cached --quiet; then
              echo "Latest main already contains equivalent generated content."
              exit 0
            fi

            git commit -m "docs: sync brain dump"
            sleep $((attempt * 2))
          done

          echo "Could not push generated content after 3 attempts."
          exit 1

      - name: Validate generated data before deploy
        run: python3 scripts/validate_generated.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
