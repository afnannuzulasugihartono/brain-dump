name: Sticky Notes Chrome Verify

on:
  push:
    branches: [feat/sticky-notes-chrome]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile Python sources
        run: python3 -m py_compile scripts/generate_timeline.py scripts/generate/issues.py scripts/validate_generated.py
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Run frontend logic tests
        run: node --experimental-default-type=module --test tests/frontend/scoring.test.js tests/frontend/data.test.js
      - name: Check frontend syntax
        run: |
          for f in docs/js/*.js; do node --check "$f"; done
      - name: Validate generated data
        run: python3 scripts/validate_generated.py
